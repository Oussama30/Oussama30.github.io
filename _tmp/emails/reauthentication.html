<!doctype html>
<html><body style="margin:0;padding:0;background:#F3F6FA">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F6FA;padding:24px 12px"><tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:14px;border:1px solid #D7DFE9">
    <tr><td style="padding:18px 26px;border-bottom:3px solid #F39200;font-family:'Segoe UI',Helvetica,Arial,sans-serif">
      <span style="display:inline-block;background:#1670A8;color:#fff;font-weight:700;font-size:13px;padding:7px 9px;border-radius:8px">EM</span>
      <span style="font-size:15px;font-weight:600;color:#1F3354;vertical-align:middle;margin-left:8px">Réseau ENSAM Meknès</span> <span dir="rtl" lang="ar" style="font-size:14px;color:#42506A;vertical-align:middle;margin-left:6px;unicode-bidi:isolate;display:inline-block;white-space:nowrap">شبكة ENSAM مكناس</span>
    </td></tr>
    <tr><td style="padding:26px 26px 8px"><div lang="fr" style="text-align:left;font-family:'Segoe UI', Helvetica, Arial, sans-serif">
      <h1 style="margin:0 0 10px;font-size:20px;color:#1F3354">Ton code de confirmation</h1>
      <p style="margin:0;font-size:15px;line-height:1.6;color:#42506A">Saisis ce code pour confirmer : <strong style="font-size:20px;letter-spacing:3px;color:#1F3354">{{ .Token }}</strong></p>
      
      <p style="margin:14px 0 0;font-size:13px;line-height:1.6;color:#66748A">Ce n’est pas toi ? Ignore cet email.</p>
    </div></td></tr>
    <tr><td style="padding:0 26px"><hr style="border:none;border-top:1px solid #E9EEF4;margin:18px 0"></td></tr>
    <tr><td style="padding:8px 26px 26px"><div lang="ar" dir="rtl" style="text-align:right;font-family:Tahoma, 'Segoe UI', Arial, sans-serif">
      <h1 style="margin:0 0 10px;font-size:20px;color:#1F3354">رمز التأكيد</h1>
      <p style="margin:0;font-size:15px;line-height:1.6;color:#42506A">أدخل هذا الرمز للتأكيد: <strong dir="ltr" style="font-size:20px;letter-spacing:3px;color:#1F3354">{{ .Token }}</strong></p>
      
      <p style="margin:14px 0 0;font-size:13px;line-height:1.6;color:#66748A">لست أنت؟ تجاهل هذه الرسالة.</p>
    </div></td></tr>
  </table>
  <p style="font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#66748A;margin:14px 0 0">Réseau ENSAM Meknès · <a href="{{ .SiteURL }}" style="color:#1670A8">{{ .SiteURL }}</a></p>
</td></tr></table>
</body></html>
