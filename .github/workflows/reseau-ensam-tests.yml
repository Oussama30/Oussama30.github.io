# Tests automatiques du Réseau ENSAM : à chaque changement du site ou de ses sources.
# Le site est reconstruit depuis reseau-ensam-source/ et doit être identique à reseau-ensam/,
# puis la base, les emails, les calculs et le site lui-même sont testés (aucun appel à la vraie base).
name: Réseau ENSAM · tests

on:
  push:
    branches: [main]
    paths: ['reseau-ensam/**', 'reseau-ensam-source/**', '.github/workflows/reseau-ensam-tests.yml']
  pull_request:
    paths: ['reseau-ensam/**', 'reseau-ensam-source/**', '.github/workflows/reseau-ensam-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reseau-ensam-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reseau-ensam-source/tests/package-lock.json
      - name: Construire le site depuis les sources
        run: sh build.sh
      - name: Le site publié correspond aux sources
        run: |
          diff -r dist ../reseau-ensam
          git diff --exit-code -- supabase/mise-a-jour.sql
      - name: Installer les outils de test
        working-directory: reseau-ensam-source/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Calculs
        working-directory: reseau-ensam-source/tests
        run: npm run unit
      - name: Base de données (règles d'accès, limites, mise à jour)
        working-directory: reseau-ensam-source/tests
        run: npm run sql
      - name: Emails et notifications
        working-directory: reseau-ensam-source/tests
        run: npm run notifier
      - name: Site (tous les écrans, parcours, hors ligne)
        working-directory: reseau-ensam-source/tests
        run: npm run site
