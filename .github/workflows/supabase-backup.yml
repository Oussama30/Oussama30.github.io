# Sauvegarde hebdomadaire de la base du Réseau ENSAM, hors de Supabase.
# La copie est chiffrée (le dépôt est public) et gardée 90 jours dans l'onglet Actions.
# Pour l'activer, ajouter deux secrets dans Settings > Secrets and variables > Actions :
#   SUPABASE_DB_URL     chaîne « Session pooler » de Supabase (Connect > Session pooler), avec le mot de passe de la base
#   BACKUP_PASSPHRASE   une phrase secrète, à garder : elle sert à ouvrir les sauvegardes
# Ouvrir une sauvegarde :  gpg -d reseau-ensam-AAAA-MM-JJ.tar.gz.gpg | tar xz
name: Supabase sauvegarde

on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Vérifier les secrets
        id: check
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "Sauvegarde pas encore activée : ajoute SUPABASE_DB_URL et BACKUP_PASSPHRASE dans les secrets du dépôt."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exporter la base
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p out
          docker run --rm -e DB_URL -v "$PWD/out:/out" postgres:17 sh -c '
            pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f /out/public.sql &&
            (pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities -f /out/comptes.sql || echo "Comptes non exportés")'
          day=$(date -u +%F)
          tar czf "reseau-ensam-$day.tar.gz" -C out .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "reseau-ensam-$day.tar.gz.gpg" "reseau-ensam-$day.tar.gz"
          rm -rf out "reseau-ensam-$day.tar.gz"
          echo "DAY=$day" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: reseau-ensam-${{ env.DAY }}
          path: reseau-ensam-*.tar.gz.gpg
          retention-days: 90
