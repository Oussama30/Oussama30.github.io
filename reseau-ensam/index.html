<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8E1F3F">
<title>Réseau ENSAM Meknès</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plateforme des lauréats et étudiants de l'ENSAM Meknès : offres de stages, PFE et emplois, mentorat, entraide et suivi de placement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Mise en page : rail de navigation (ordinateur) / barre d'onglets en bas (téléphone),
   contenu en colonne de lecture large. Identité : bordeaux Arts et Métiers + laiton pour l'impact. */
:root {
  --bg: #F2F3F6; --surface: #FFFFFF; --surface-2: #E9ECF1; --ink: #161A24; --ink-2: #464E60; --muted: #687085; --line: #D9DDE5;
  --accent: #8E1F3F; --accent-ink: #FFFFFF; --accent-soft: #F5E6EB;
  --brass: #8F6212; --brass-soft: #F6EDD8;
  --good: #1D7348; --good-soft: #E1F2E8; --warn: #9A5800; --warn-soft: #FAEDD5; --bad: #B0222E; --bad-soft: #FAE3E4;
  --s1: #8E1F3F; --s2: #2B6C93; --blue: #2B6C93; --teal: #0F6F66;
  --shadow: 0 1px 2px rgb(20 24 36 / .06), 0 4px 16px rgb(20 24 36 / .05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1117; --surface: #161A22; --surface-2: #1E232E; --ink: #E8EBF1; --ink-2: #B6BCCA; --muted: #8A91A2; --line: #2A303C;
  --accent: #E46C8C; --accent-ink: #1B0710; --accent-soft: #3A1823; --brass: #E2B25F; --brass-soft: #33291A;
  --good: #5DC991; --good-soft: #14301F; --warn: #EEAE52; --warn-soft: #33270F; --bad: #F27C83; --bad-soft: #3A1719;
  --s1: #E46C8C; --s2: #6CB2DB; --blue: #6CB2DB; --teal: #4FC7B9; --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1117; --surface: #161A22; --surface-2: #1E232E; --ink: #E8EBF1; --ink-2: #B6BCCA; --muted: #8A91A2; --line: #2A303C;
  --accent: #E46C8C; --accent-ink: #1B0710; --accent-soft: #3A1823; --brass: #E2B25F; --brass-soft: #33291A;
  --good: #5DC991; --good-soft: #14301F; --warn: #EEAE52; --warn-soft: #33270F; --bad: #F27C83; --bad-soft: #3A1719;
  --s1: #E46C8C; --s2: #6CB2DB; --blue: #6CB2DB; --teal: #4FC7B9; --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 750; letter-spacing: -.015em; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.2rem); }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .84rem; } .spacer { flex: 1; }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: .3rem; }
.lead { color: var(--ink-2); max-width: 62ch; margin-top: .4rem; }
.sel { user-select: all; }
.row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.row-end { display: flex; justify-content: flex-end; gap: .6rem; flex-wrap: wrap; margin-top: .4rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .8rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .8rem; }

/* Coque */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 1.2rem; padding: 1.2rem .9rem; background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .65rem; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; } .brand-txt strong { font-family: var(--f-display); font-size: 1.05rem; } .brand-txt span { font-size: .75rem; color: var(--muted); }
.brand-mark { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 750 .95rem/1 var(--f-display); letter-spacing: .02em; flex: none; }
.brand-mark.big { width: 64px; height: 64px; font-size: 1.5rem; border-radius: 14px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: .7rem; padding: .55rem .7rem; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; position: relative; }
.side-nav a:hover { background: var(--surface-2); color: var(--ink); }
.side-nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.dotn { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: auto; }
.side-foot { margin-top: auto; padding: 0 .7rem; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: .7rem; padding-block: .6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.mobile-only { display: none; }
.demo-band { padding-block: .45rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--brass-soft); color: var(--brass); font-size: .82rem; border-bottom: 1px solid var(--line); }
.content { padding-block: 1.6rem 5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }
.page.narrow { max-width: 760px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.section-head { display: flex; align-items: center; gap: .7rem; justify-content: space-between; flex-wrap: wrap; margin-top: .6rem; }
.section-title { margin-top: .6rem; }
.persona { display: flex; align-items: center; gap: .4rem; }
.persona select { max-width: 11rem; }
.me-btn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
.bell-wrap { position: relative; }
.badge-n { position: absolute; top: -2px; right: -2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 600 .68rem/17px var(--f-body); text-align: center; }
.bell-pop { position: absolute; right: 0; top: calc(100% + 8px); width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: .7rem; display: flex; flex-direction: column; gap: 2px; z-index: 40; }
.bell-pop h3 { padding: .2rem .4rem .5rem; }
.notif { display: flex; gap: .6rem; align-items: flex-start; text-align: left; width: 100%; padding: .55rem .5rem; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--ink-2); }
.notif span { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.notif:hover { background: var(--surface-2); }
.notif.act { color: var(--ink); } .notif.act .ico:first-child { color: var(--accent); }
.bottom-nav { display: none; }

/* Éléments */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.accent { background: var(--brass-soft); border-color: color-mix(in srgb, var(--brass) 40%, transparent); color: var(--brass); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.danger-t { color: var(--bad) !important; }
.btn.small { padding: .38rem .75rem; font-size: .86rem; }
.btn.tiny { padding: .25rem .55rem; font-size: .8rem; }
.btn.wide { width: 100%; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; position: relative; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.small { width: 28px; height: 28px; }
.icon-btn.on { color: var(--accent); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; }
input, select, textarea { width: 100%; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
select { width: auto; max-width: 100%; }
textarea { resize: vertical; }
.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.field-label { font-size: .82rem; font-weight: 600; color: var(--ink-2); }
.field-hint { font-size: .78rem; color: var(--muted); }
.form { display: flex; flex-direction: column; gap: .9rem; }
.checks { display: flex; flex-direction: column; gap: .4rem; }
.check, .switch { display: flex; align-items: center; gap: .5rem; font-size: .9rem; cursor: pointer; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; flex: none; background: hsl(var(--h) 42% 40%); color: #fff; font-weight: 600; font-family: var(--f-body); letter-spacing: .02em; }
.person { display: inline-flex; align-items: center; gap: .6rem; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; min-width: 0; color: inherit; }
.person-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.person-name { font-weight: 600; }
.person:hover .person-name { color: var(--accent); }
.role-line { font-size: .8rem; color: var(--muted); display: inline-flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.verif { color: var(--teal); display: inline-flex; }
.lvl { font: 600 .68rem/1 var(--f-body); letter-spacing: .04em; text-transform: uppercase; padding: .22rem .45rem; border-radius: 5px; border: 1px solid currentColor; color: var(--muted); }
.lvl-1 { color: #9C6B3E; } .lvl-2 { color: var(--ink-2); } .lvl-3, .lvl-4, .lvl-5 { color: var(--brass); background: var(--brass-soft); }
.tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: .6rem .8rem; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.count { display: inline-block; min-width: 1.4em; padding: 0 .35em; border-radius: 9px; background: var(--surface-2); color: var(--ink-2); font: 600 .74rem/1.5 var(--f-mono); text-align: center; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 9px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: .38rem .8rem; border-radius: 7px; font-weight: 600; font-size: .86rem; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: .3rem .75rem; border-radius: 999px; font-size: .85rem; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.mini { display: inline-block; font-size: .74rem; padding: .1rem .45rem; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); margin: 0 .25rem .25rem 0; font-weight: 500; }
.tag { display: inline-flex; align-items: center; gap: .25rem; font-size: .74rem; font-weight: 600; padding: .18rem .5rem; border-radius: 5px; letter-spacing: .01em; }
.t-stage { --c: var(--blue); } .t-pfe { --c: var(--accent); } .t-etranger { --c: var(--teal); } .t-emploi { --c: var(--brass); }
.tag.t-stage, .tag.t-pfe, .tag.t-etranger, .tag.t-emploi { color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.chip.on.t-stage, .chip.on.t-pfe, .chip.on.t-etranger, .chip.on.t-emploi { background: var(--c); border-color: var(--c); color: var(--surface); }
.tag.done { background: var(--surface-2); color: var(--muted); }
.tag.coopt { background: var(--good-soft); color: var(--good); }
.tag.urgent { background: var(--bad-soft); color: var(--bad); }
.state-pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; font-weight: 600; padding: .2rem .6rem; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.state-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-trouve, .m-terminee { background: var(--good-soft); color: var(--good); }
.s-validation, .m-acceptee { background: var(--brass-soft); color: var(--brass); }
.s-entretiens { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
.s-recherche, .m-demande { background: var(--surface-2); color: var(--ink-2); }
.m-refusee { background: var(--bad-soft); color: var(--bad); }
.empty { display: flex; flex-direction: column; align-items: center; gap: .4rem; text-align: center; padding: 2rem 1rem; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.empty strong { color: var(--ink); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
.panel .section-head { margin-top: 0; }
.callout { background: var(--accent-soft); border-radius: var(--r); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; }
.callout h2 { color: var(--accent); }
.todo { list-style: none; margin: 0; padding: 0; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; align-items: start; }
.two-col > * { min-width: 0; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: visible; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); transition: width .5s ease; }
.bar-pace { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: .4rem .5rem; border-bottom: 1px solid var(--line); }
.tbl td { padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-cell { width: 40%; vertical-align: middle !important; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: .7rem 1.1rem; border-radius: 10px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); font-weight: 500; animation: pop .25s ease; }
.toast.err { background: var(--bad); color: #fff; } .toast.win { background: var(--brass); color: var(--surface); }
@keyframes pop { from { transform: translate(-50%, 8px); opacity: .4; } }
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgb(10 12 18 / .45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
.modal.wide { width: min(760px, 100%); }
.modal-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1.1rem; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 1; }
.modal-body { padding: 1.1rem; display: flex; flex-direction: column; gap: .8rem; }

/* Offres */
.filters { display: flex; flex-direction: column; gap: .7rem; }
.filter-row { display: flex; gap: .5rem; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: .4rem; flex: 1 1 240px; padding: 0 .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }
.search input { border: 0; padding: .55rem 0; background: transparent; }
.search input:focus-visible { outline: none; }
.feed { display: flex; flex-direction: column; gap: .8rem; }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.offer.closed { opacity: .78; }
.offer-top { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.offer-title { font-size: 1.12rem; }
.offer-meta { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; color: var(--ink-2); font-size: .9rem; }
.dot { color: var(--muted); }
.offer-target { margin-top: .1rem; }
.offer-desc { color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 75ch; }
.offer-desc.full { display: block; }
.offer-more { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .5rem 1rem; margin: 0; padding: .7rem; background: var(--surface-2); border-radius: 8px; }
.offer-more dt { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.offer-more dd { margin: 0; overflow-wrap: anywhere; }
.offer-author { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; padding-top: .3rem; }
.impact-pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem; font-weight: 600; color: var(--good); background: var(--good-soft); padding: .2rem .55rem; border-radius: 999px; }
.offer-actions { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: .55rem; }
.act { display: inline-flex; align-items: center; gap: .35rem; border: 0; background: none; padding: .35rem .55rem; border-radius: 7px; color: var(--ink-2); font-size: .86rem; font-weight: 500; cursor: pointer; }
.act b { font-family: var(--f-mono); font-weight: 500; }
.act:hover { background: var(--surface-2); }
.act.on { color: var(--accent); background: var(--accent-soft); }
.owner-bar { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; background: var(--surface-2); border-radius: 8px; padding: .4rem .6rem; }
.comments { display: flex; flex-direction: column; gap: .6rem; border-top: 1px solid var(--line); padding-top: .7rem; }
.comment { display: flex; gap: .6rem; align-items: flex-start; }
.comment-body { flex: 1; min-width: 0; } .comment-body p { overflow-wrap: anywhere; }
.comment-form { display: flex; gap: .5rem; }
.cta-post { display: flex; align-items: center; gap: 1rem; justify-content: space-between; flex-wrap: wrap; padding: 1rem 1.1rem; border: 1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius: var(--r); }

/* Parcours / impact */
.objective { display: flex; gap: 1.2rem; justify-content: space-between; flex-wrap: wrap; padding: 1.2rem 1.3rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--muted); }
.objective.st-trouve { border-left-color: var(--good); } .objective.st-validation { border-left-color: var(--brass); } .objective.st-entretiens { border-left-color: var(--blue); } .objective.st-recherche, .objective.st-candidatures { border-left-color: var(--accent); }
